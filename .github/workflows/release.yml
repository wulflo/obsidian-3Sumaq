name: Release

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate manifest
        id: manifest
        run: |
          set -euo pipefail

          if [ ! -f manifest.json ]; then
            echo "::error::manifest.json not found"
            exit 1
          fi

          if [ ! -f theme.css ]; then
            echo "::error::theme.css not found"
            exit 1
          fi

          version=$(jq -r '.version // empty' manifest.json)

          if [ -z "$version" ]; then
            echo "::error::manifest.json does not contain a version"
            exit 1
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$version' is not valid SemVer (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected version: $version"

      - name: Check whether the tag already exists
        id: tag
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${VERSION} already exists. Skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} does not exist yet. A release will be created."
          fi

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.version }}
          name: ${{ steps.manifest.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            manifest.json
            theme.css
